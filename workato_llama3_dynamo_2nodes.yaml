apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: llama3-disagg
  namespace: dynamo-cloud
spec:
  services:
    Frontend:
      envFromSecret: hf-secret
      componentType: frontend
      replicas: 1
      resources: 
        requests:
          cpu: "8"
          memory: "32Gi"
        limits:
          cpu: "8"
          memory: "32Gi"
      extraPodSpec:
        imagePullSecrets:
          - name: nvcr-secret
        initContainers:
        - name: config-downloader
          image: python:3.10-slim
          command: ["/bin/bash", "-c"]
          args:
          - |
            pip install huggingface_hub
            python3 -c "import os; from huggingface_hub import snapshot_download; snapshot_download(repo_id='neuralmagic/Meta-Llama-3.1-70B-Instruct-FP8', local_dir='/ssd/neuralmagic/Meta-Llama-3.1-70B-Instruct-FP8', token=os.environ['HF_TOKEN'], allow_patterns=['*.json', '*.model', '*.txt'])"
          env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: hf_api_token
          volumeMounts:
          - name: fake-ssd
            mountPath: /ssd
        volumes:
        - name: fake-ssd
          emptyDir: {}
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.2.1
          command: ["python3"]
          args: ["-m", "dynamo.frontend"]
          env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: hf_api_token
          volumeMounts:
          - name: fake-ssd
            mountPath: /ssd

    # =========================================================================
    # DECODE WORKER: 1 Replica on 4 GPUs (TP=4) - 4 GPUs Total
    # =========================================================================
    VllmDecodeWorker:
      envFromSecret: hf-secret
      componentType: worker
      replicas: 1
      sharedMemory:
        size: 200Gi
      resources:
        requests:
          cpu: "48"
          memory: "500Gi"
          gpu: "4"
        limits:
          cpu: "48"
          memory: "500Gi"
          gpu: "4"
      extraPodSpec:
        imagePullSecrets:
          - name: nvcr-secret
        nodeSelector:
          cloud.google.com/gke-accelerator: "nvidia-b200"
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                - key: cloud.google.com/gke-spot
                  operator: In
                  values: ["true"]
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Equal"
            value: "present"
            effect: "NoSchedule"
          - key: "cloud.google.com/gke-preemptible"
            operator: "Equal"
            value: "true"
            effect: "NoExecute"
            tolerationSeconds: 30
        
        initContainers:
        - name: nccl-plugin-installer
          image: us-docker.pkg.dev/gce-ai-infra/gpudirect-gib/nccl-plugin-gib:v1.1.2
          imagePullPolicy: Always
          args:
          - |
            set -ex
            /scripts/container_entry.sh install --install-nccl
            cp -R /var/lib/gib/lib64/. /target/usr/local/gib/lib64
            cp -R /var/lib/gib/. /target/usr/local/gib
          command: ["/bin/sh", "-c"]
          volumeMounts:
          - mountPath: /target/usr/local/gib
            name: gib

        - name: model-downloader
          image: python:3.10-slim
          command: ["/bin/bash", "-c"]
          args:
          - |
            MODEL_ID="neuralmagic/Meta-Llama-3.1-70B-Instruct-FP8"
            LOCAL_DIR="/ssd/neuralmagic/Meta-Llama-3.1-70B-Instruct-FP8"
            if [ -f "${LOCAL_DIR}/config.json" ]; then exit 0; fi
            pip install huggingface_hub
            python3 -c "import os; from huggingface_hub import snapshot_download; snapshot_download(repo_id='${MODEL_ID}', local_dir='${LOCAL_DIR}', token=os.environ['HF_TOKEN'])"
          env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: hf_api_token
          volumeMounts:
          - name: local-ssd
            mountPath: /ssd

        volumes:
        - name: gib
          emptyDir: {}
        - name: local-ssd
          hostPath:
            path: /mnt/stateful_partition/kube-ephemeral-ssd

        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.2.1
          env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: hf_api_token
          - name: UCX_TLS
            value: "all"
          securityContext:
            privileged: true
          workingDir: /workspace/examples/backends/vllm
          volumeMounts:
            - name: gib
              mountPath: /usr/local/gib
            - name: local-ssd
              mountPath: /ssd
          command: ["/bin/bash", "-c"]
          args:
          - |
            export NCCL_PLUGIN_PATH=/usr/local/gib/lib64
            export LD_LIBRARY_PATH=/usr/local/gib/lib64:/usr/local/nvidia/lib64:$LD_LIBRARY_PATH
            export NCCL_INIT_SCRIPT="/usr/local/gib/scripts/set_nccl_env.sh"
            
            if [[ -n "${NCCL_INIT_SCRIPT}" ]]; then source ${NCCL_INIT_SCRIPT}; /sbin/ldconfig; fi

            export VLLM_NCCL_SO_PATH=/usr/local/gib/lib64/libnccl.so.2
            export NCCL_DEBUG=INFO
            export NCCL_CROSS_NIC=1
            export NCCL_ALGO=Ring,Tree
            export UCX_TLS=all

            # Count the number of NVIDIA devices mounted on this node
            GPU_COUNT=$(ls -1 /dev/nvidia[0-9]* 2>/dev/null | wc -l)

            if [ "$GPU_COUNT" -eq 8 ]; then
                mkdir -p /ssd/locks
                exec 200>/ssd/locks/gpu_assign_tp4.lock
                flock -x 200
                
                # Initialize block counter if it doesn't exist
                if [ ! -f /ssd/locks/gpu_block_tp4 ]; then
                    echo "0" > /ssd/locks/gpu_block_tp4
                fi
                
                BLOCK=$(cat /ssd/locks/gpu_block_tp4)
                
                if [ "$BLOCK" -eq 0 ]; then
                    export CUDA_VISIBLE_DEVICES="0,1,2,3"
                    echo "1" > /ssd/locks/gpu_block_tp4
                else
                    export CUDA_VISIBLE_DEVICES="4,5,6,7"
                    echo "0" > /ssd/locks/gpu_block_tp4
                fi
                
                flock -u 200
            else
                # Default fallback if isolated container environment
                export CUDA_VISIBLE_DEVICES="0,1,2,3"
            fi

            echo "Assigned CUDA_VISIBLE_DEVICES: $CUDA_VISIBLE_DEVICES"

            python3 -m dynamo.vllm \
              --model /ssd/neuralmagic/Meta-Llama-3.1-70B-Instruct-FP8 \
              --tokenizer neuralmagic/Meta-Llama-3.1-70B-Instruct-FP8 \
              --served-model-name neuralmagic/Meta-Llama-3.1-70B-Instruct-FP8 \
              --tensor-parallel-size 4 \
              --gpu-memory-utilization 0.90 \
              --max-model-len 32768 \
              --max-num-batched-tokens 32768 \
              --kv-cache-dtype fp8 \
              --block-size 128 \
              --no-enable-prefix-caching \
              --trust-remote-code \
              --download-dir /ssd/neuralmagic/Meta-Llama-3.1-70B-Instruct-FP8 \
              --disable-log-stats \
              --disaggregation-mode decode

    # =========================================================================
    # PREFILL WORKERS: 3 Replicas with 4 GPUs each (TP=4) - 12 GPUs Total
    # =========================================================================
    VllmPrefillWorker:
      envFromSecret: hf-secret
      componentType: worker
      replicas: 3                      # 3 prefill workers x 4 GPUs = 12 GPUs
      sharedMemory:
        size: 200Gi
      resources:
        requests:
          cpu: "48"
          memory: "500Gi"
          gpu: "4"                      # TP=4 per prefill worker for 26k ISL
        limits:
          cpu: "48"
          memory: "500Gi"
          gpu: "4"
      extraPodSpec:
        imagePullSecrets:
          - name: nvcr-secret
        nodeSelector:
          cloud.google.com/gke-accelerator: "nvidia-b200"
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                - key: cloud.google.com/gke-spot
                  operator: In
                  values: ["true"]
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Equal"
            value: "present"
            effect: "NoSchedule"
          - key: "cloud.google.com/gke-preemptible"
            operator: "Equal"
            value: "true"
            effect: "NoExecute"
            tolerationSeconds: 30
        
        initContainers:
        - name: nccl-plugin-installer
          image: us-docker.pkg.dev/gce-ai-infra/gpudirect-gib/nccl-plugin-gib:v1.1.2
          imagePullPolicy: Always
          args:
          - |
            set -ex
            /scripts/container_entry.sh install --install-nccl
            cp -R /var/lib/gib/lib64/. /target/usr/local/gib/lib64
            cp -R /var/lib/gib/. /target/usr/local/gib
          command: ["/bin/sh", "-c"]
          volumeMounts:
          - mountPath: /target/usr/local/gib
            name: gib

        - name: model-downloader
          image: python:3.10-slim
          command: ["/bin/bash", "-c"]
          args:
          - |
            MODEL_ID="neuralmagic/Meta-Llama-3.1-70B-Instruct-FP8"
            LOCAL_DIR="/ssd/neuralmagic/Meta-Llama-3.1-70B-Instruct-FP8"

            if [ -f "${LOCAL_DIR}/config.json" ]; then exit 0; fi

            pip install huggingface_hub
            python3 -c "import os; from huggingface_hub import snapshot_download; snapshot_download(repo_id='${MODEL_ID}', local_dir='${LOCAL_DIR}', token=os.environ['HF_TOKEN'])"
          env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: hf_api_token
          volumeMounts:
          - name: local-ssd
            mountPath: /ssd

        volumes:
        - name: gib
          emptyDir: {}
        - name: local-ssd
          hostPath:
            path: /mnt/stateful_partition/kube-ephemeral-ssd

        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.2.1
          env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: hf_api_token
          - name: UCX_TLS
            value: "all"
          securityContext:
            privileged: true
          workingDir: /workspace/examples/backends/vllm
          volumeMounts:
            - name: gib
              mountPath: /usr/local/gib
            - name: local-ssd
              mountPath: /ssd
          command: ["/bin/bash", "-c"]
          args:
          - |
            export NCCL_PLUGIN_PATH=/usr/local/gib/lib64
            export LD_LIBRARY_PATH=/usr/local/gib/lib64:/usr/local/nvidia/lib64:$LD_LIBRARY_PATH
            export NCCL_INIT_SCRIPT="/usr/local/gib/scripts/set_nccl_env.sh"
            
            if [[ -n "${NCCL_INIT_SCRIPT}" ]]; then source ${NCCL_INIT_SCRIPT}; /sbin/ldconfig; fi
            export VLLM_NCCL_SO_PATH=/usr/local/gib/lib64/libnccl.so.2
            export NCCL_DEBUG=INFO
            export NCCL_CROSS_NIC=1
            export NCCL_ALGO=Ring,Tree
            export UCX_TLS=all

            # Count the number of NVIDIA devices mounted on this node
            GPU_COUNT=$(ls -1 /dev/nvidia[0-9]* 2>/dev/null | wc -l)

            if [ "$GPU_COUNT" -eq 8 ]; then
                mkdir -p /ssd/locks
                exec 200>/ssd/locks/gpu_assign_tp4.lock
                flock -x 200
                
                # Initialize block counter if it doesn't exist
                if [ ! -f /ssd/locks/gpu_block_tp4 ]; then
                    echo "0" > /ssd/locks/gpu_block_tp4
                fi
                
                BLOCK=$(cat /ssd/locks/gpu_block_tp4)
                
                if [ "$BLOCK" -eq 0 ]; then
                    export CUDA_VISIBLE_DEVICES="0,1,2,3"
                    echo "1" > /ssd/locks/gpu_block_tp4
                else
                    export CUDA_VISIBLE_DEVICES="4,5,6,7"
                    echo "0" > /ssd/locks/gpu_block_tp4
                fi
                
                flock -u 200
            else
                # Default fallback if isolated container environment
                export CUDA_VISIBLE_DEVICES="0,1,2,3"
            fi

            echo "Assigned CUDA_VISIBLE_DEVICES: $CUDA_VISIBLE_DEVICES"

            python3 -m dynamo.vllm \
              --model /ssd/neuralmagic/Meta-Llama-3.1-70B-Instruct-FP8 \
              --tokenizer neuralmagic/Meta-Llama-3.1-70B-Instruct-FP8 \
              --served-model-name neuralmagic/Meta-Llama-3.1-70B-Instruct-FP8 \
              --tensor-parallel-size 4 \
              --gpu-memory-utilization 0.95 \
              --max-model-len 32768 \
              --max-num-batched-tokens 32768 \
              --kv-cache-dtype fp8 \
              --block-size 128 \
              --no-enable-prefix-caching \
              --trust-remote-code \
              --download-dir /ssd/neuralmagic/Meta-Llama-3.1-70B-Instruct-FP8 \
              --disable-log-stats \
              --disaggregation-mode prefill \
              --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
