apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: llama3-disagg
  namespace: dynamo-cloud
spec:
  services:
    Frontend:
      envFromSecret: hf-secret
      componentType: frontend
      replicas: 1
      resources: 
        requests:
          cpu: "8"
          memory: "32Gi"
        limits:
          cpu: "8"
          memory: "32Gi"
      extraPodSpec:
        imagePullSecrets:
          - name: nvcr-secret
        #######
        # NEW: Download ONLY the config/tokenizer files for the Frontend
        initContainers:
        - name: config-downloader
          image: python:3.10-slim
          command: ["/bin/bash", "-c"]
          args:
          - |
            pip install huggingface_hub
            python3 -c "import os; from huggingface_hub import snapshot_download; snapshot_download(repo_id='meta-llama/Meta-Llama-3.1-70B-Instruct', local_dir='/ssd/meta-llama/Meta-Llama-3.1-70B-Instruct', token=os.environ['HF_TOKEN'], allow_patterns=['*.json', '*.model', '*.txt'])"
          env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: hf_api_token
          volumeMounts:
          - name: fake-ssd
            mountPath: /ssd
            
        # NEW: Provide a temporary volume for the configs
        volumes:
        - name: fake-ssd
          emptyDir: {}
        #######
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.2.1
          command: ["python3"]
          args: ["-m", "dynamo.frontend"]
          env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: hf_api_token
            # NEW: Mount the configs so the Frontend finds them locally
          volumeMounts:
          - name: fake-ssd
            mountPath: /ssd
          
    VllmDecodeWorker:
      envFromSecret: hf-secret
      componentType: worker
      replicas: 1
      sharedMemory:
        size: 200Gi
      resources:
        requests:
          cpu: "48"
          memory: "500Gi"
          gpu: "4"
        limits:
          cpu: "48"
          memory: "500Gi"
          gpu: "4"
      extraPodSpec:
        imagePullSecrets:
          - name: nvcr-secret
        nodeSelector:
          cloud.google.com/gke-accelerator: "nvidia-b200"
        # NEW: Added affinity for spot instance preferences
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                - key: cloud.google.com/gke-spot
                  operator: In
                  values: ["true"]
        # CHANGED: Updated tolerations for spot instance interruptions
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Equal"
            value: "present"
            effect: "NoSchedule"
          - key: "cloud.google.com/gke-preemptible"  # NEW: For spot interruption handling
            operator: "Equal"
            value: "true"
            effect: "NoExecute"
            tolerationSeconds: 30  # NEW: 30 seconds to gracefully shutdown
        
        initContainers:
        # 1. NCCL Installer
        - name: nccl-plugin-installer
          image: us-docker.pkg.dev/gce-ai-infra/gpudirect-gib/nccl-plugin-gib:v1.1.2
          imagePullPolicy: Always
          args:
          - |
            set -ex
            /scripts/container_entry.sh install --install-nccl
            cp -R /var/lib/gib/lib64/. /target/usr/local/gib/lib64
            cp -R /var/lib/gib/. /target/usr/local/gib
          command: ["/bin/sh", "-c"]
          volumeMounts:
          - mountPath: /target/usr/local/gib
            name: gib

        # 2. Model DOWNLOADER (Skips if exists)
        - name: model-downloader
          image: python:3.10-slim
          command: ["/bin/bash", "-c"]
          args:
          - |
            MODEL_ID="meta-llama/Meta-Llama-3.1-70B-Instruct"
            LOCAL_DIR="/ssd/meta-llama/Meta-Llama-3.1-70B-Instruct"
            if [ -f "${LOCAL_DIR}/config.json" ]; then exit 0; fi
            pip install huggingface_hub
            python3 -c "import os; from huggingface_hub import snapshot_download; snapshot_download(repo_id='${MODEL_ID}', local_dir='${LOCAL_DIR}', token=os.environ['HF_TOKEN'])"
          env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: hf_api_token
          volumeMounts:
          - name: local-ssd
            mountPath: /ssd

        volumes:
        - name: gib
          emptyDir: {}
        - name: local-ssd
          hostPath:
            path: /mnt/stateful_partition/kube-ephemeral-ssd

        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.2.1
          env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: hf_api_token
          securityContext:
            privileged: true
          workingDir: /workspace/examples/backends/vllm
          volumeMounts:
            - name: gib
              mountPath: /usr/local/gib
            - name: local-ssd
              mountPath: /ssd
          command: ["/bin/bash", "-c"]
          args:
          - |
            # Setup NCCL Environment from the plugin
            export NCCL_PLUGIN_PATH=/usr/local/gib/lib64
            export LD_LIBRARY_PATH=/usr/local/gib/lib64:/usr/local/nvidia/lib64:$LD_LIBRARY_PATH
            export NCCL_INIT_SCRIPT="/usr/local/gib/scripts/set_nccl_env.sh"
            
            if [[ -n "${NCCL_INIT_SCRIPT}" ]]; then source ${NCCL_INIT_SCRIPT}; /sbin/ldconfig; fi

            # Force vLLM to use the system NCCL (GIB) and enable Debug logging
            export VLLM_NCCL_SO_PATH=/usr/local/gib/lib64/libnccl.so.2
            export NCCL_DEBUG=INFO

            # Count the number of NVIDIA devices mounted
            GPU_COUNT=$(ls -1 /dev/nvidia[0-9]* | wc -l)
            
            if [ "$GPU_COUNT" -eq 8 ]; then
                if [[ "$HOSTNAME" == *"decode"* ]]; then
                    export CUDA_VISIBLE_DEVICES="4,5,6,7"
                else
                    # Use a file lock on the shared local SSD to prevent race conditions
                    # Pod A claims 0-3, Pod B claims 4-7
                    mkdir -p /ssd/locks
                    exec 200>/ssd/locks/gpu_assign.lock
                    flock -x 200
                    
                    if [ ! -f /ssd/locks/gpu_toggle ]; then
                        echo "0" > /ssd/locks/gpu_toggle
                    fi
                    TOGGLE=$(cat /ssd/locks/gpu_toggle)
                    
                    if [ "$TOGGLE" -eq 0 ]; then
                        export CUDA_VISIBLE_DEVICES="0,1,2,3"
                        echo "1" > /ssd/locks/gpu_toggle
                    else
                        export CUDA_VISIBLE_DEVICES="4,5,6,7"
                        echo "0" > /ssd/locks/gpu_toggle
                    fi
                    
                    flock -u 200
                fi
            else
                export CUDA_VISIBLE_DEVICES="0,1,2,3"
            fi
            
            echo "Assigned CUDA_VISIBLE_DEVICES: $CUDA_VISIBLE_DEVICES"

            python3 -m dynamo.vllm \
              --model /ssd/meta-llama/Meta-Llama-3.1-70B-Instruct \
              --tokenizer meta-llama/Meta-Llama-3.1-70B-Instruct \
              --served-model-name meta-llama/Meta-Llama-3.1-70B-Instruct \
              --tensor-parallel-size 4 \
              --gpu-memory-utilization 0.9 \
              --max-model-len 32768 \
              --trust-remote-code \
              --download-dir /ssd/meta-llama/Meta-Llama-3.1-70B-Instruct \
              --disable-log-stats \
              --disaggregation-mode decode

    VllmPrefillWorker:
      envFromSecret: hf-secret
      componentType: worker
      replicas: 3
      sharedMemory:
        size: 200Gi
      resources:
        requests:
          cpu: "48"
          memory: "500Gi"
          gpu: "4"
        limits:
          cpu: "48"
          memory: "500Gi"
          gpu: "4"
      extraPodSpec:
        imagePullSecrets:
          - name: nvcr-secret
        nodeSelector:
          cloud.google.com/gke-accelerator: "nvidia-b200"
        # NEW: Added affinity for spot instance preferences
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                - key: cloud.google.com/gke-spot
                  operator: In
                  values: ["true"]
        # CHANGED: Updated tolerations for spot instance interruptions
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Equal"
            value: "present"
            effect: "NoSchedule"
          - key: "cloud.google.com/gke-preemptible"  # NEW: For spot interruption handling
            operator: "Equal"
            value: "true"
            effect: "NoExecute"
            tolerationSeconds: 30  # NEW: 30 seconds to gracefully shutdown
        
        initContainers:
        - name: nccl-plugin-installer
          image: us-docker.pkg.dev/gce-ai-infra/gpudirect-gib/nccl-plugin-gib:v1.1.2
          imagePullPolicy: Always
          args:
          - |
            set -ex
            /scripts/container_entry.sh install --install-nccl
            cp -R /var/lib/gib/lib64/. /target/usr/local/gib/lib64
            cp -R /var/lib/gib/. /target/usr/local/gib
          command: ["/bin/sh", "-c"]
          volumeMounts:
          - mountPath: /target/usr/local/gib
            name: gib

        - name: model-downloader
          image: python:3.10-slim
          command: ["/bin/bash", "-c"]
          args:
          - |
            MODEL_ID="meta-llama/Meta-Llama-3.1-70B-Instruct"
            LOCAL_DIR="/ssd/meta-llama/Meta-Llama-3.1-70B-Instruct"

            if [ -f "${LOCAL_DIR}/config.json" ]; then exit 0; fi

            pip install huggingface_hub
            python3 -c "import os; from huggingface_hub import snapshot_download; snapshot_download(repo_id='${MODEL_ID}', local_dir='${LOCAL_DIR}', token=os.environ['HF_TOKEN'])"
          env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: hf_api_token
          volumeMounts:
          - name: local-ssd
            mountPath: /ssd

        volumes:
        - name: gib
          emptyDir: {}
        - name: local-ssd
          hostPath:
            path: /mnt/stateful_partition/kube-ephemeral-ssd

        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.2.1
          env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: hf_api_token
          # Added privileged security context
          securityContext:
            privileged: true
          workingDir: /workspace/examples/backends/vllm
          volumeMounts:
            - name: gib
              mountPath: /usr/local/gib
            - name: local-ssd
              mountPath: /ssd
          command: ["/bin/bash", "-c"]
          args:
          - |
            export NCCL_PLUGIN_PATH=/usr/local/gib/lib64
            export LD_LIBRARY_PATH=/usr/local/gib/lib64:/usr/local/nvidia/lib64:$LD_LIBRARY_PATH
            export NCCL_INIT_SCRIPT="/usr/local/gib/scripts/set_nccl_env.sh"
            
            if [[ -n "${NCCL_INIT_SCRIPT}" ]]; then source ${NCCL_INIT_SCRIPT}; /sbin/ldconfig; fi
            export VLLM_NCCL_SO_PATH=/usr/local/gib/lib64/libnccl.so.2
            export NCCL_DEBUG=INFO

            # Count the number of NVIDIA devices mounted
            GPU_COUNT=$(ls -1 /dev/nvidia[0-9]* | wc -l)
            
            if [ "$GPU_COUNT" -eq 8 ]; then
                if [[ "$HOSTNAME" == *"decode"* ]]; then
                    export CUDA_VISIBLE_DEVICES="4,5,6,7"
                else
                    # Use a file lock on the shared local SSD to prevent race conditions
                    # Pod A claims 0-3, Pod B claims 4-7
                    mkdir -p /ssd/locks
                    exec 200>/ssd/locks/gpu_assign.lock
                    flock -x 200
                    
                    if [ ! -f /ssd/locks/gpu_toggle ]; then
                        echo "0" > /ssd/locks/gpu_toggle
                    fi
                    TOGGLE=$(cat /ssd/locks/gpu_toggle)
                    
                    if [ "$TOGGLE" -eq 0 ]; then
                        export CUDA_VISIBLE_DEVICES="0,1,2,3"
                        echo "1" > /ssd/locks/gpu_toggle
                    else
                        export CUDA_VISIBLE_DEVICES="4,5,6,7"
                        echo "0" > /ssd/locks/gpu_toggle
                    fi
                    
                    flock -u 200
                fi
            else
                export CUDA_VISIBLE_DEVICES="0,1,2,3"
            fi
            
            echo "Assigned CUDA_VISIBLE_DEVICES: $CUDA_VISIBLE_DEVICES"

            python3 -m dynamo.vllm \
              --model /ssd/meta-llama/Meta-Llama-3.1-70B-Instruct \
              --tokenizer meta-llama/Meta-Llama-3.1-70B-Instruct \
              --served-model-name meta-llama/Meta-Llama-3.1-70B-Instruct \
              --tensor-parallel-size 4 \
              --gpu-memory-utilization 0.9 \
              --max-model-len 32768 \
              --trust-remote-code \
              --download-dir /ssd/meta-llama/Meta-Llama-3.1-70B-Instruct \
              --disable-log-stats \
              --disaggregation-mode prefill \
              --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
