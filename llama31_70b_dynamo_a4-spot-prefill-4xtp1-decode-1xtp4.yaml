apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: llama3-disagg
  namespace: dynamo-cloud
spec:
  services:
    Frontend:
      envFromSecret: hf-secret
      componentType: frontend
      replicas: 1
      resources: 
        requests:
          cpu: "8"
          memory: "32Gi"
        limits:
          cpu: "8"
          memory: "32Gi"
      extraPodSpec:
        imagePullSecrets:
          - name: nvcr-secret
        initContainers:
        - name: config-downloader
          image: python:3.10-slim
          command: ["/bin/bash", "-c"]
          args:
          - |
            pip install huggingface_hub
            python3 -c "import os; from huggingface_hub import snapshot_download; snapshot_download(repo_id='neuralmagic/Meta-Llama-3.1-70B-Instruct-FP8', local_dir='/ssd/neuralmagic/Meta-Llama-3.1-70B-Instruct-FP8', token=os.environ['HF_TOKEN'], allow_patterns=['*.json', '*.model', '*.txt'])"
          env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: hf_api_token
          volumeMounts:
          - name: fake-ssd
            mountPath: /ssd
        volumes:
        - name: fake-ssd
          emptyDir: {}
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.2.1
          command: ["python3"]
          args: ["-m", "dynamo.frontend"]
          env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: hf_api_token
          volumeMounts:
          - name: fake-ssd
            mountPath: /ssd

    # =========================================================================
    # DECODE WORKER: 1 Replica on 4 GPUs (TP=4) for high memory bandwidth
    # =========================================================================
    VllmDecodeWorker:
      envFromSecret: hf-secret
      componentType: worker
      replicas: 1
      sharedMemory:
        size: 200Gi
      resources:
        requests:
          cpu: "48"
          memory: "500Gi"
          gpu: "4"
        limits:
          cpu: "48"
          memory: "500Gi"
          gpu: "4"
      extraPodSpec:
        imagePullSecrets:
          - name: nvcr-secret
        nodeSelector:
          cloud.google.com/gke-accelerator: "nvidia-b200"
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                - key: cloud.google.com/gke-spot
                  operator: In
                  values: ["true"]
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Equal"
            value: "present"
            effect: "NoSchedule"
          - key: "cloud.google.com/gke-preemptible"
            operator: "Equal"
            value: "true"
            effect: "NoExecute"
            tolerationSeconds: 30
        
        initContainers:
        - name: nccl-plugin-installer
          image: us-docker.pkg.dev/gce-ai-infra/gpudirect-gib/nccl-plugin-gib:v1.1.2
          imagePullPolicy: Always
          args:
          - |
            set -ex
            /scripts/container_entry.sh install --install-nccl
            cp -R /var/lib/gib/lib64/. /target/usr/local/gib/lib64
            cp -R /var/lib/gib/. /target/usr/local/gib
          command: ["/bin/sh", "-c"]
          volumeMounts:
          - mountPath: /target/usr/local/gib
            name: gib

        - name: model-downloader
          image: python:3.10-slim
          command: ["/bin/bash", "-c"]
          args:
          - |
            MODEL_ID="neuralmagic/Meta-Llama-3.1-70B-Instruct-FP8"
            LOCAL_DIR="/ssd/neuralmagic/Meta-Llama-3.1-70B-Instruct-FP8"
            if [ -f "${LOCAL_DIR}/config.json" ]; then exit 0; fi
            pip install huggingface_hub
            python3 -c "import os; from huggingface_hub import snapshot_download; snapshot_download(repo_id='${MODEL_ID}', local_dir='${LOCAL_DIR}', token=os.environ['HF_TOKEN'])"
          env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: hf_api_token
          volumeMounts:
          - name: local-ssd
            mountPath: /ssd

        volumes:
        - name: gib
          emptyDir: {}
        - name: local-ssd
          hostPath:
            path: /mnt/stateful_partition/kube-ephemeral-ssd

        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.2.1
          env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: hf_api_token
          securityContext:
            privileged: true
          workingDir: /workspace/examples/backends/vllm
          volumeMounts:
            - name: gib
              mountPath: /usr/local/gib
            - name: local-ssd
              mountPath: /ssd
          command: ["/bin/bash", "-c"]
          args:
          - |
            export NCCL_PLUGIN_PATH=/usr/local/gib/lib64
            export LD_LIBRARY_PATH=/usr/local/gib/lib64:/usr/local/nvidia/lib64:$LD_LIBRARY_PATH
            export NCCL_INIT_SCRIPT="/usr/local/gib/scripts/set_nccl_env.sh"
            
            if [[ -n "${NCCL_INIT_SCRIPT}" ]]; then source ${NCCL_INIT_SCRIPT}; /sbin/ldconfig; fi

            export VLLM_NCCL_SO_PATH=/usr/local/gib/lib64/libnccl.so.2
            export NCCL_DEBUG=INFO

            # Count the number of NVIDIA devices mounted
            GPU_COUNT=$(ls -1 /dev/nvidia[0-9]* | wc -l)
            
            if [ "$GPU_COUNT" -eq 8 ]; then
                if [[ "$HOSTNAME" == *"decode"* ]]; then
                    # The single decode worker gets the first 4 GPUs
                    export CUDA_VISIBLE_DEVICES="0,1,2,3"
                else
                    # The 4 prefill workers dynamically claim exactly 1 GPU each (4 through 7)
                    mkdir -p /ssd/locks
                    exec 200>/ssd/locks/gpu_assign.lock
                    flock -x 200
                    
                    if [ ! -f /ssd/locks/gpu_counter ]; then
                        echo "4" > /ssd/locks/gpu_counter
                    fi
                    MY_GPU=$(cat /ssd/locks/gpu_counter)
                    
                    # Assign the single GPU to this prefill worker
                    export CUDA_VISIBLE_DEVICES="$MY_GPU"
                    
                    # Increment counter for the next prefill pod (loop back to 4 if it exceeds 7)
                    NEXT_GPU=$((MY_GPU + 1))
                    if [ "$NEXT_GPU" -gt 7 ]; then
                        NEXT_GPU=4
                    fi
                    echo "$NEXT_GPU" > /ssd/locks/gpu_counter
                    
                    flock -u 200
                fi
            else
                # Fallback if not exactly 8 GPUs are found
                export CUDA_VISIBLE_DEVICES="0,1,2,3"
            fi
            
            echo "Assigned CUDA_VISIBLE_DEVICES: $CUDA_VISIBLE_DEVICES"

            python3 -m dynamo.vllm \
              --model /ssd/neuralmagic/Meta-Llama-3.1-70B-Instruct-FP8 \
              --tokenizer neuralmagic/Meta-Llama-3.1-70B-Instruct-FP8 \
              --served-model-name neuralmagic/Meta-Llama-3.1-70B-Instruct-FP8 \
              --tensor-parallel-size 4 \
              --gpu-memory-utilization 0.9 \
              --max-model-len 32768 \
              --kv-cache-dtype fp8 \
              --block-size 128 \
              --trust-remote-code \
              --download-dir /ssd/neuralmagic/Meta-Llama-3.1-70B-Instruct-FP8 \
              --disable-log-stats \
              --disaggregation-mode decode

    # =========================================================================
    # PREFILL WORKERS: 4 Replicas with 1 GPU each (TP=1) for parallel prefill
    # =========================================================================
    VllmPrefillWorker:
      envFromSecret: hf-secret
      componentType: worker
      replicas: 4                      # 4 independent workers (1 GPU each)
      sharedMemory:
        size: 200Gi
      resources:
        requests:
          cpu: "16"
          memory: "250Gi"
          gpu: "1"                     # 1 GPU per prefill worker
        limits:
          cpu: "16"
          memory: "250Gi"
          gpu: "1"                     # 1 GPU per prefill worker
      extraPodSpec:
        imagePullSecrets:
          - name: nvcr-secret
        nodeSelector:
          cloud.google.com/gke-accelerator: "nvidia-b200"
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                - key: cloud.google.com/gke-spot
                  operator: In
                  values: ["true"]
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Equal"
            value: "present"
            effect: "NoSchedule"
          - key: "cloud.google.com/gke-preemptible"
            operator: "Equal"
            value: "true"
            effect: "NoExecute"
            tolerationSeconds: 30
        
        initContainers:
        - name: nccl-plugin-installer
          image: us-docker.pkg.dev/gce-ai-infra/gpudirect-gib/nccl-plugin-gib:v1.1.2
          imagePullPolicy: Always
          args:
          - |
            set -ex
            /scripts/container_entry.sh install --install-nccl
            cp -R /var/lib/gib/lib64/. /target/usr/local/gib/lib64
            cp -R /var/lib/gib/. /target/usr/local/gib
          command: ["/bin/sh", "-c"]
          volumeMounts:
          - mountPath: /target/usr/local/gib
            name: gib

        - name: model-downloader
          image: python:3.10-slim
          command: ["/bin/bash", "-c"]
          args:
          - |
            MODEL_ID="neuralmagic/Meta-Llama-3.1-70B-Instruct-FP8"
            LOCAL_DIR="/ssd/neuralmagic/Meta-Llama-3.1-70B-Instruct-FP8"

            if [ -f "${LOCAL_DIR}/config.json" ]; then exit 0; fi

            pip install huggingface_hub
            python3 -c "import os; from huggingface_hub import snapshot_download; snapshot_download(repo_id='${MODEL_ID}', local_dir='${LOCAL_DIR}', token=os.environ['HF_TOKEN'])"
          env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: hf_api_token
          volumeMounts:
          - name: local-ssd
            mountPath: /ssd

        volumes:
        - name: gib
          emptyDir: {}
        - name: local-ssd
          hostPath:
            path: /mnt/stateful_partition/kube-ephemeral-ssd

        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.2.1
          env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: hf-secret
                key: hf_api_token
          securityContext:
            privileged: true
          workingDir: /workspace/examples/backends/vllm
          volumeMounts:
            - name: gib
              mountPath: /usr/local/gib
            - name: local-ssd
              mountPath: /ssd
          command: ["/bin/bash", "-c"]
          args:
          - |
            export NCCL_PLUGIN_PATH=/usr/local/gib/lib64
            export LD_LIBRARY_PATH=/usr/local/gib/lib64:/usr/local/nvidia/lib64:$LD_LIBRARY_PATH
            export NCCL_INIT_SCRIPT="/usr/local/gib/scripts/set_nccl_env.sh"
            
            if [[ -n "${NCCL_INIT_SCRIPT}" ]]; then source ${NCCL_INIT_SCRIPT}; /sbin/ldconfig; fi
            export VLLM_NCCL_SO_PATH=/usr/local/gib/lib64/libnccl.so.2
            export NCCL_DEBUG=INFO

            # Count the number of NVIDIA devices mounted
            GPU_COUNT=$(ls -1 /dev/nvidia[0-9]* | wc -l)
            
            if [ "$GPU_COUNT" -eq 8 ]; then
                if [[ "$HOSTNAME" == *"decode"* ]]; then
                    # The single decode worker gets the first 4 GPUs
                    export CUDA_VISIBLE_DEVICES="0,1,2,3"
                else
                    # The 4 prefill workers dynamically claim exactly 1 GPU each (4 through 7)
                    mkdir -p /ssd/locks
                    exec 200>/ssd/locks/gpu_assign.lock
                    flock -x 200
                    
                    if [ ! -f /ssd/locks/gpu_counter ]; then
                        echo "4" > /ssd/locks/gpu_counter
                    fi
                    MY_GPU=$(cat /ssd/locks/gpu_counter)
                    
                    # Assign the single GPU to this prefill worker
                    export CUDA_VISIBLE_DEVICES="$MY_GPU"
                    
                    # Increment counter for the next prefill pod (loop back to 4 if it exceeds 7)
                    NEXT_GPU=$((MY_GPU + 1))
                    if [ "$NEXT_GPU" -gt 7 ]; then
                        NEXT_GPU=4
                    fi
                    echo "$NEXT_GPU" > /ssd/locks/gpu_counter
                    
                    flock -u 200
                fi
            else
                # Fallback if not exactly 8 GPUs are found
                export CUDA_VISIBLE_DEVICES="0,1,2,3"
            fi
            
            echo "Assigned CUDA_VISIBLE_DEVICES: $CUDA_VISIBLE_DEVICES"

            python3 -m dynamo.vllm \
              --model /ssd/neuralmagic/Meta-Llama-3.1-70B-Instruct-FP8 \
              --tokenizer neuralmagic/Meta-Llama-3.1-70B-Instruct-FP8 \
              --served-model-name neuralmagic/Meta-Llama-3.1-70B-Instruct-FP8 \
              --tensor-parallel-size 1 \
              --gpu-memory-utilization 0.95 \
              --max-model-len 32768 \
              --max-num-batched-tokens 8192 \
              --kv-cache-dtype fp8 \
              --block-size 128 \
              --trust-remote-code \
              --download-dir /ssd/neuralmagic/Meta-Llama-3.1-70B-Instruct-FP8 \
              --disable-log-stats \
              --disaggregation-mode prefill \
              --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
